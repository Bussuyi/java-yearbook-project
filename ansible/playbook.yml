
---
- name: Configure and deploy DevOps applications
  hosts: webservers
  become: yes

  tasks:

    - name: Update Ubuntu package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required dependencies
      apt:
        name:
          - docker.io
          - docker-compose-v2
          - python3
          - git
        state: present

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create deployment directory
      file:
        path: /opt/capstone
        state: directory
        mode: '0755'

    - name: Copy portfolio application
      copy:
        src: "{{ playbook_dir }}/../myportfolio"
        dest: /opt/capstone/
        mode: preserve

    - name: Copy Java application
      copy:
        src: "{{ playbook_dir }}/../java"
        dest: /opt/capstone/
        mode: preserve

    - name: Copy Docker Compose configuration
      copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: /opt/capstone/docker-compose.yml
        mode: '0644'

    - name: Build and deploy applications
      command: docker compose up -d --build
      args:
        chdir: /opt/capstone
