
name: DevOps End-to-End Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Build Java Application
        run: |
          cd java
          mvn clean package -DskipTests

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        
      - name: Debug OIDC
        env:
          ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          echo "Role ARN, spaced out so GitHub does not mask it:"
          echo "$ARN" | sed 's/./& /g'
          echo "Length: ${#ARN}"
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 - "$TOKEN" <<'PY'
          import sys, base64, json
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          print({k: c.get(k) for k in ('iss', 'aud', 'sub')})
          PY

      - name: Check secrets exist
        env:
          K: ${{ secrets.AWS_ACCESS_KEY_ID }}
          S: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          [ -n "$K" ] && echo "key id: SET (length ${#K})" || echo "key id: EMPTY"
          [ -n "$S" ] && echo "secret: SET (length ${#S})" || echo "secret: EMPTY"
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Initialize Terraform
        run: terraform -chdir=terraform init

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Apply Terraform
        run: terraform -chdir=terraform apply -auto-approve
        env:
          TF_VAR_key_name: devops-capstone-key

      - name: Get EC2 Public IP
        id: terraform-output
        run: |
          IP=$(terraform -chdir=terraform output -raw ec2_public_ip)
          echo "EC2_IP=$IP" >> $GITHUB_ENV

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '${{ secrets.EC2_SSH_PRIVATE_KEY }}' > ~/.ssh/devops-key.pem
          chmod 600 ~/.ssh/devops-key.pem

      - name: Generate Ansible Inventory
        run: |
          mkdir -p ansible
          cat > ansible/inventory.ini <<EOF
          [webservers]
          aws-server ansible_host=${EC2_IP} ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/devops-key.pem
          EOF

      - name: Deploy Applications with Ansible
        run: |
          ANSIBLE_HOST_KEY_CHECKING=False \
          ansible-playbook \
          -i ansible/inventory.ini \
          ansible/playbook.yml
