name: DevOps End-to-End Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: java/pom.xml

      - name: Build Java Application
        run: |
          cd java
          mvn clean package -DskipTests

      - name: Configure Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Initialize Terraform
        run: terraform -chdir=terraform init

      - name: Validate Terraform
        run: terraform -chdir=terraform validate

      - name: Apply Terraform
        run: terraform -chdir=terraform apply -auto-approve
        env:
          TF_VAR_key_name: devops-capstone-key

      - name: Get EC2 Public IP
        run: |
          IP=$(terraform -chdir=terraform output -raw ec2_public_ip)
          echo "EC2_IP=$IP" >> $GITHUB_ENV

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Prepare SSH Key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/devops-key.pem
          chmod 600 ~/.ssh/devops-key.pem

      - name: Generate Ansible Inventory
        run: |
          mkdir -p ansible
          cat > ansible/inventory.ini <<EOF
          [webservers]
          aws-server ansible_host=${EC2_IP} ansible_user=ubuntu ansible_ssh_private_key_file=$HOME/.ssh/devops-key.pem
          EOF
          cat ansible/inventory.ini

      - name: Wait for SSH
        run: |
          for i in $(seq 1 30); do
            nc -z -w 5 "$EC2_IP" 22 && break
            echo "Waiting for SSH..."; sleep 10
          done

      - name: Deploy Applications with Ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
